[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypixelgui"
version = "0.1.0"
description = "Cross-platform desktop GUI for iPixel Color LED displays (built on pypixelcolor)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "pypixelcolor>=0.5.0",
  "PySide6>=6.6",
  "Pillow",
  "certifi",
  "tzdata; sys_platform == 'win32'",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: X11 Applications :: Qt",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
pypixelgui = "pypixelgui.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pypixelgui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
